<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4"/>
    </pattern>

    <!-- Marker Arrows -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowViolet" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#818cf8"/>
    </marker>
    <marker id="arrowFuchsia" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#d946ef"/>
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#f59e0b"/>
    </marker>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="650" rx="16" fill="url(#bgGradient)"/>
  <rect width="1200" height="650" rx="16" fill="url(#techGrid)"/>

  <!-- Title & Slide Header -->
  <text x="50" y="55" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5">
    Proposed System Architecture
  </text>
  <text x="1140" y="55" fill="#64748b" font-family="monospace" font-size="18" font-weight="600">07</text>
  <line x1="50" y1="75" x2="1150" y2="75" stroke="#1e293b" stroke-width="1.5"/>

  <!-- ================= CONNECTION PATHS ================= -->

  <!-- User -> Canvas Editor -->
  <path d="M 150 330 L 220 330" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <circle cx="185" cy="330" r="4" fill="#fbbf24"/>

  <!-- Canvas Editor -> Normalize -->
  <path d="M 350 330 L 420 330" fill="none" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrowViolet)"/>
  <circle cx="385" cy="330" r="4" fill="#fbbf24"/>

  <!-- Normalize -> Deterministic Engine -->
  <path d="M 550 330 L 620 330" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowEmerald)"/>
  <circle cx="585" cy="330" r="4" fill="#fbbf24"/>

  <!-- Deterministic Engine -> RAG (Upper Branch) -->
  <path d="M 720 280 C 720 210, 770 210, 830 210" fill="none" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrowViolet)"/>
  <circle cx="770" cy="210" r="4" fill="#fbbf24"/>

  <!-- Deterministic Engine -> LLM (Lower Branch) -->
  <path d="M 720 380 C 720 450, 770 450, 830 450" fill="none" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrowViolet)"/>
  <circle cx="770" cy="450" r="4" fill="#fbbf24"/>

  <!-- RAG -> LLM (Context Augmentation) -->
  <path d="M 890 260 L 890 395" fill="none" stroke="#d946ef" stroke-width="2.5" marker-end="url(#arrowEmerald)"/>
  <circle cx="890" cy="330" r="4" fill="#fbbf24"/>
  <rect x="830" y="318" width="120" height="22" rx="4" fill="#0f172a" stroke="#d946ef" stroke-width="1"/>
  <text x="890" y="333" fill="#f0abfc" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">RAG Context</text>

  <!-- LLM -> Feedback -->
  <path d="M 960 450 C 1010 450, 1010 350, 1040 340" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowEmerald)"/>
  <circle cx="1000" cy="450" r="4" fill="#fbbf24"/>

  <!-- Deterministic Fallback (Zero Crash Direct Curve to Feedback) -->
  <path d="M 700 390 C 700 560, 1050 560, 1090 395" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowAmber)"/>
  <rect x="800" y="540" width="200" height="24" rx="12" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="900" y="556" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ Zero-Crash Deterministic Fallback</text>


  <!-- ================= COMPONENT CARDS ================= -->

  <!-- 1. USER -->
  <g transform="translate(40, 280)">
    <rect width="110" height="100" rx="16" fill="#0c1929" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <text x="55" y="56" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">User</text>
    <text x="55" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Developer / Candidate</text>
  </g>

  <!-- 2. CANVAS EDITOR -->
  <g transform="translate(220, 280)">
    <rect width="130" height="100" rx="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#glow)"/>
    <text x="65" y="52" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Editor</text>
    <text x="65" y="72" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">React Flow Canvas</text>
  </g>

  <!-- 3. DOMAIN NORMALIZER -->
  <g transform="translate(420, 280)">
    <rect width="130" height="100" rx="16" fill="#062d22" stroke="#34d399" stroke-width="2" filter="url(#glow)"/>
    <text x="65" y="52" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Normalize</text>
    <text x="65" y="72" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Domain Normalizer</text>
  </g>

  <!-- 4. DETERMINISTIC ENGINE (RULES & METRICS) -->
  <g transform="translate(620, 270)">
    <rect width="145" height="120" rx="18" fill="#18182b" stroke="#f59e0b" stroke-width="2.5" filter="url(#glow)"/>
    <rect x="22" y="16" width="101" height="18" rx="9" fill="#451a03" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="72.5" y="29" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">100% DETERMINISTIC</text>
    <text x="72.5" y="60" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Rules &amp; Metrics</text>
    <text x="72.5" y="80" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">DFS Cycles &amp; SPOF</text>
    <text x="72.5" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Coupling &amp; Score (0-100)</text>
  </g>

  <!-- 5. RAG RETRIEVAL -->
  <g transform="translate(830, 160)">
    <rect width="130" height="100" rx="16" fill="#2e1065" stroke="#d946ef" stroke-width="2" filter="url(#glow)"/>
    <text x="65" y="52" fill="#f0abfc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">RAG</text>
    <text x="65" y="72" fill="#e879f9" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">15 Knowledge Docs</text>
  </g>

  <!-- 6. LLM SYNTHESIS -->
  <g transform="translate(830, 400)">
    <rect width="130" height="100" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
    <text x="65" y="52" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">LLM</text>
    <text x="65" y="72" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Gemini / Groq</text>
  </g>

  <!-- 7. FEEDBACK -->
  <g transform="translate(1040, 280)">
    <rect width="125" height="100" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <text x="62.5" y="52" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Feedback</text>
    <text x="62.5" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Grounded Critique</text>
  </g>

</svg>
